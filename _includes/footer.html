<div class="row footer">
    <div class="col-md-10 col-md-offset-1">
        <div class="row">
            <div class="col-md-4">
                <h4>Current information</h4>
                <ul>
                    <li><a href="{{ '/' | relative_url }}#current-status">Current status — October 2026</a></li>
                    <li><a href="https://groups.google.com/g/potteries-hackspace">Contact us on Google Groups</a></li>
                    <li><a href="{{ '/contact' | relative_url }}">Contact and community links</a></li>
                </ul>
            </div>
            <div class="col-md-8">
                <h4>From the archive</h4>
                <ul>
                    {% for post in site.posts limit:8 %}
                    <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a> ({{ post.date | date: '%Y' }})</li>
                    {% endfor %}
                </ul>
                <p><a href="{{ '/archive' | relative_url }}">Browse the full archive</a></p>
            </div>
        </div>
    </div>
</div>
