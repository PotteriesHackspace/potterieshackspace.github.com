<ul class="nav navbar-nav">
    {% assign navigation = 'About:/about,Events:/events,Equipment:/equipment,Membership:/join,Contact:/contact,Archive:/archive' | split: ',' %}
    {% for item in navigation %}
    {% assign link = item | split: ':' %}
    {% assign html_url = link[1] | append: '.html' %}
    <li{% if page.url == link[1] or page.url == html_url %} class="active"{% endif %}><a href="{{ link[1] | relative_url }}">{{ link[0] }}</a></li>
    {% endfor %}
</ul>
